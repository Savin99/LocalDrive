name: LocalDrive
options:
  bundleIdPrefix: com.ilyaqa
  # Весь интерфейс на русском: системные кнопки и форматы («Вставить», «МБ») тоже
  developmentLanguage: ru
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
# Локальная модель для чата (этап 5): MLX и токенизатор Hugging Face.
# Версии закреплены точно — проверены по исходникам, см. docs/llm-ondevice.md
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.13.0
targets:
  LocalDrive:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MLXSwiftLM
        products:
          - MLXLLM
          # Модель для документов: «текст + картинка» (docs/doc-reader.md)
          - MLXVLM
          - MLXLMCommon
          - MLXGuidedGeneration
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftHuggingFace
        product: HuggingFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilyaqa.LocalDrive
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "15"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/LocalDrive.entitlements
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: LocalDrive
        NSFaceIDUsageDescription: Face ID подтверждает, что номер документа в чате открываете вы
        NSPhotoLibraryUsageDescription: Доступ к галерее нужен, чтобы добавлять фото в ваше хранилище
        NSRemindersFullAccessUsageDescription: Чтобы напомнить заранее о замене документа — без его номера и данных
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Своя папка приложения в «Файлах» → «На iPhone» → LocalDrive.
        # Хранилище лежит в Application Support, поэтому наружу видно только Documents
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ilyaqa.LocalDrive.feed-block
            UTTypeDescription: Блок ленты LocalDrive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
          - UTTypeIdentifier: com.ilyaqa.LocalDrive.file-name
            UTTypeDescription: Файл папки LocalDrive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
  LocalDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LocalDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LocalDriveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LocalDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
