name: LocalDrive
options:
  bundleIdPrefix: com.ilyaqa
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LocalDrive:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilyaqa.LocalDrive
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/LocalDrive.entitlements
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: LocalDrive
        NSFaceIDUsageDescription: Face ID используется для разблокировки ваших файлов
        NSPhotoLibraryUsageDescription: Доступ к галерее нужен, чтобы добавлять фото в ваше хранилище
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
